<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Enterprise Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ms-blue: #0078D4;
      --ms-blue-hover: #005A9E;
      --ms-blue-dark: #004578;
      --ms-blue-soft: rgba(0, 120, 212, 0.08);
      --ms-blue-glow: rgba(0, 120, 212, 0.22);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.1);
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --bg-acrylic: rgba(255, 255, 255, 0.84);
      --bg-sidebar: rgba(255, 255, 255, 0.76);
      --bg-header: rgba(255, 255, 255, 0.72);
      --card-acrylic: rgba(255, 255, 255, 0.88);
      --border-light: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(15, 23, 42, 0.08);
      --error-text: #D13438;
      --error-bg: #FDE7E9;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background-color: #f1f5f9; color: var(--text-main);
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }

    body.dashboard-mode {
      display: flex; align-items: stretch; justify-content: flex-start;
      overflow-x: hidden; overflow-y: auto; background-color: #f1f5f9;
    }

    .ambient-bg {
      position: fixed; inset: 0; z-index: -2; overflow: hidden;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0f9ff 100%);
    }

    .grid-overlay {
      position: fixed; inset: 0; z-index: -1;
      background-image: linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
      -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
    }

    body.dashboard-mode .grid-overlay {
      background-size: 36px 36px; mask-image: none; -webkit-mask-image: none;
    }

    .orb {
      position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.55;
      animation: float 22s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .orb-1 { width: 48vw; height: 48vw; background: #93c5fd; top: -12%; left: -10%; }
    .orb-2 { width: 55vw; height: 55vw; background: #c4b5fd; bottom: -18%; right: -10%; animation-delay: -5s; }
    .orb-3 { width: 38vw; height: 38vw; background: #67e8f9; top: 35%; left: 28%; animation-delay: -10s; opacity: 0.4; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 8%) scale(1.08); }
    }

    .auth-wrapper {
      width: 100%; max-width: 440px; padding: 20px;
      animation: scaleFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateY(16px) scale(0.98);
    }
    @keyframes scaleFadeIn { to { opacity: 1; transform: translateY(0) scale(1); } }

    .auth-container {
      background: var(--bg-acrylic); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--border-light); border-radius: 18px; padding: 42px 38px 34px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08), 0 4px 16px rgba(15, 23, 42, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .logo-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; width: 28px; height: 28px; flex-shrink: 0; }
    .logo-square { background: var(--ms-blue); border-radius: 2px; }
    .logo-square:nth-child(2) { background: #38bdf8; }
    .logo-square:nth-child(3) { background: #0284c7; }
    .brand-name { font-weight: 700; font-size: 0.96rem; color: var(--text-main); letter-spacing: -0.01em; }

    .security-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      background: var(--emerald-soft); border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: #059669;
    }
    .security-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }

    .auth-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.02em; }
    .auth-header p { color: var(--text-muted); margin: 0 0 26px 0; font-size: 0.88rem; }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 13px; color: #94a3b8; pointer-events: none; width: 17px; height: 17px; transition: color 0.2s; }
    .form-control {
      width: 100%; background: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1;
      border-radius: 9px; color: var(--text-main); padding: 11px 14px 11px 40px; font-size: 0.9rem; font-family: inherit;
      transition: all 0.2s ease;
    }
    .form-control:focus { outline: none; border-color: var(--ms-blue); background: #ffffff; box-shadow: 0 0 0 3.5px var(--ms-blue-glow); }
    .form-control:focus + .input-icon, .input-wrap:focus-within .input-icon { color: var(--ms-blue); }

    .btn-submit {
      width: 100%; margin-top: 8px; background: linear-gradient(180deg, #0078D4 0%, #0062B1 100%); color: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1); padding: 12px 16px; border-radius: 9px; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 120, 212, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .btn-submit:hover { background: linear-gradient(180deg, #006CBE 0%, #005299 100%); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 120, 212, 0.32); }
    .btn-submit:active { transform: translateY(0); }

    .error-msg {
      background: var(--error-bg); color: var(--error-text); border: 1px solid rgba(209, 52, 56, 0.2);
      padding: 11px 14px; border-radius: 9px; font-size: 0.8rem; font-weight: 500; margin-bottom: 18px;
      display: none; align-items: center; gap: 10px;
    }
    .auth-footer {
      margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: #94a3b8;
    }

    #app-root { display: none; width: 100%; min-height: 100vh; }

    .sidebar {
      width: 268px; min-height: 100vh; background: var(--bg-sidebar); backdrop-filter: blur(36px); -webkit-backdrop-filter: blur(36px);
      border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 24px 16px;
      position: sticky; top: 0; height: 100vh; z-index: 20; flex-shrink: 0;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 4px 12px 22px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px; }
    .brand-title { display: flex; flex-direction: column; }
    .brand-title strong { font-size: 0.98rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.01em; }
    .brand-title span { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .nav-group { margin-bottom: 24px; }
    .nav-label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; padding: 0 12px; margin-bottom: 8px; }
    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
      border-radius: 9px; font-size: 0.85rem; font-weight: 500; color: #475569; cursor: pointer; transition: all 0.18s ease;
      text-decoration: none;
    }
    .nav-item-left { display: flex; align-items: center; gap: 10px; }
    .nav-item-left svg { width: 17px; height: 17px; opacity: 0.85; }
    .nav-item:hover { background: rgba(0, 120, 212, 0.06); color: var(--text-main); }
    .nav-item.active { background: var(--ms-blue); color: #ffffff; font-weight: 600; box-shadow: 0 4px 12px rgba(0, 120, 212, 0.24); }
    .nav-item.active svg { opacity: 1; }
    .nav-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; padding: 2px 7px; border-radius: 6px; background: rgba(15, 23, 42, 0.06); color: #475569; font-weight: 600; }
    .nav-item.active .nav-badge { background: rgba(255, 255, 255, 0.22); color: #ffffff; }

    .sidebar-telemetry {
      margin-top: auto; background: rgba(255, 255, 255, 0.8); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
    }
    .telemetry-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.74rem; font-weight: 600; color: var(--text-secondary); }
    .status-dot-green { width: 8px; height: 8px; background: var(--emerald); border-radius: 50%; box-shadow: 0 0 8px var(--emerald); }
    .progress-bar { width: 100%; height: 4px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { width: 94%; height: 100%; background: linear-gradient(90deg, #0078D4, #10b981); border-radius: 999px; }
    .telemetry-meta { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--text-muted); }

    .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 66px; background: var(--bg-header); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border-bottom: 1px solid var(--border-subtle); padding: 0 36px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 15;
    }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--text-muted); }
    .breadcrumbs strong { color: var(--text-main); font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .btn-lock {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
      background: rgba(15, 23, 42, 0.04); border: 1px solid var(--border-subtle); border-radius: 8px;
      font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.18s;
    }
    .btn-lock:hover { background: rgba(209, 52, 56, 0.08); color: var(--error-text); border-color: rgba(209, 52, 56, 0.2); }

    .content { max-width: 1180px; width: 100%; margin: 0 auto; padding: 34px 36px 48px; flex: 1; }

    .page-hero {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
      margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle);
    }
    .page-hero h1 { font-size: 1.55rem; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.02em; }
    .page-hero p { margin: 0; font-size: 0.88rem; color: var(--text-muted); }
    .hero-stats { display: flex; gap: 28px; }
    .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 600; color: var(--text-main); }

    .release-banner {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 249, 255, 0.92) 100%);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 120, 212, 0.25);
      border-radius: 16px; padding: 24px 28px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      box-shadow: 0 12px 32px rgba(0, 120, 212, 0.07), inset 0 1px 0 #ffffff;
      position: relative; overflow: hidden;
    }
    .release-banner::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, var(--ms-blue), #38bdf8);
    }
    .release-left { display: flex; align-items: flex-start; gap: 18px; min-width: 0; }
    .release-icon {
      width: 52px; height: 52px; border-radius: 12px;
      background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
      color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(0, 120, 212, 0.28);
    }
    .release-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .release-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .release-title { font-size: 1.08rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.01em; }
    .badge-verified {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; font-weight: 600;
      padding: 2px 8px; border-radius: 6px; background: var(--emerald-soft); color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .badge-version {
      font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; font-weight: 600;
      padding: 2px 8px; border-radius: 6px; background: var(--ms-blue-soft); color: var(--ms-blue);
    }
    .release-desc { font-size: 0.85rem; color: var(--text-muted); margin: 0; line-height: 1.45; }
    .release-meta {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px;
    }
    .hash-pill {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.08); padding: 3px 9px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s ease; color: var(--text-muted);
    }
    .hash-pill:hover { background: rgba(0, 120, 212, 0.08); color: var(--ms-blue); border-color: rgba(0, 120, 212, 0.25); }

    .release-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .btn-download-primary {
      background: linear-gradient(180deg, #0078D4 0%, #0062B1 100%);
      color: #ffffff; text-decoration: none; border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 13px 22px; border-radius: 10px; font-size: 0.88rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 120, 212, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap;
    }
    .btn-download-primary:hover {
      background: linear-gradient(180deg, #006CBE 0%, #005299 100%);
      transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 120, 212, 0.36);
    }
    .btn-download-primary:active { transform: translateY(0); }
    .btn-download-primary.downloading { background: #059669; pointer-events: none; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; margin-top: 10px; }
    .section-title { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.04em; }
    .section-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; padding: 2px 8px; border-radius: 999px; background: var(--ms-blue-soft); color: var(--ms-blue); font-weight: 600; }
    .section-hint { font-size: 0.76rem; color: var(--text-muted); }

    .grid-top-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 32px; }
    .grid-bottom-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }

    .card {
      background: var(--card-acrylic); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-light); border-radius: 14px; cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03), 0 1px 3px rgba(15, 23, 42, 0.02);
      position: relative; overflow: hidden; user-select: none;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--ms-blue), #38bdf8); opacity: 0; transition: opacity 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px); background: #ffffff;
      border-color: rgba(0, 120, 212, 0.28); box-shadow: 0 14px 32px rgba(15, 23, 42, 0.07);
    }
    .card:hover::before { opacity: 1; }
    .card.copied { border-color: rgba(16, 185, 129, 0.45); background: #f8fffc; }
    .card.copied::before { background: var(--emerald); opacity: 1; }

    .card-primary { padding: 24px 26px; gap: 16px; }
    .card-top-row { display: flex; align-items: center; justify-content: space-between; }
    .icon-box {
      width: 44px; height: 44px; border-radius: 10px; background: var(--ms-blue-soft);
      display: flex; align-items: center; justify-content: center; color: var(--ms-blue); transition: all 0.2s ease;
    }
    .icon-box svg { width: 21px; height: 21px; }
    .card:hover .icon-box { background: var(--ms-blue); color: #ffffff; box-shadow: 0 6px 14px rgba(0, 120, 212, 0.25); }
    .card.copied .icon-box { background: var(--emerald); color: #ffffff; }

    .card-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; font-weight: 600;
      padding: 4px 9px; border-radius: 6px; background: rgba(15, 23, 42, 0.04); color: #475569;
      border: 1px solid rgba(15, 23, 42, 0.06); transition: all 0.2s;
    }
    .card.copied .card-badge { background: var(--emerald-soft); color: #059669; border-color: rgba(16, 185, 129, 0.25); }

    .card-content { display: flex; flex-direction: column; gap: 5px; }
    .card-primary .card-title { font-weight: 700; font-size: 1.06rem; color: var(--text-main); }
    .card-primary .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.48; }

    .card-footer-meta {
      padding-top: 13px; border-top: 1px solid rgba(15, 23, 42, 0.06);
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #64748b;
    }
    .action-label { color: var(--ms-blue); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .card.copied .action-label { color: #059669; }

    .card-compact { padding: 18px; gap: 12px; border-radius: 13px; }
    .card-compact .icon-box { width: 38px; height: 38px; border-radius: 9px; }
    .card-compact .icon-box svg { width: 18px; height: 18px; }
    .card-compact .card-title { font-weight: 600; font-size: 0.92rem; color: var(--text-main); }
    .card-compact .card-desc { font-size: 0.76rem; color: var(--text-muted); line-height: 1.4; }
    .card-compact .card-footer-meta { padding-top: 10px; font-size: 0.68rem; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(16px);
      color: #ffffff; padding: 12px 18px; border-radius: 10px; font-size: 0.82rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12); transform: translateY(80px); opacity: 0;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; pointer-events: none;
    }
    .toast.visible { transform: translateY(0); opacity: 1; }
    .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }

    .footer {
      padding: 20px 36px; color: #94a3b8; font-size: 0.74rem; border-top: 1px solid var(--border-subtle);
      display: flex; justify-content: space-between; align-items: center;
    }

    @media (max-width: 1024px) {
      .grid-bottom-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .release-banner { flex-direction: column; align-items: stretch; }
      .btn-download-primary { justify-content: center; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .grid-top-2, .grid-bottom-4 { grid-template-columns: 1fr; }
      .content, .topbar { padding-left: 20px; padding-right: 20px; }
      .hero-stats { display: none; }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="grid-overlay"></div>

  <!-- LOGIN SCREEN -->
  <div class="auth-wrapper" id="login-screen">
    <div class="auth-container">
      <div class="top-bar">
        <div class="brand-row">
          <div class="logo-container"><div class="logo-square"></div><div class="logo-square"></div><div class="logo-square"></div><div class="logo-square"></div></div>
          <span class="brand-name">Workspace Hub</span>
        </div>
        <div class="security-pill"><span class="security-dot"></span>TLS 1.3 SSO</div>
      </div>
      <div class="auth-header">
        <h1>Sign in</h1>

      return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" }, mat, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);

      try {
        const raw = JSON.parse(atob(ENCRYPTED_VAULT));
        const key = await deriveKey(user, pass, new Uint8Array(raw.s));
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(raw.i) }, key, new Uint8Array(raw.c));
        const data = JSON.parse(dec.decode(decrypted));
        launchDashboard(data.html, data.cmds, data.files || FILES_CONFIG);
      } catch (err) {
        errBox.style.display = "flex";
      }
    });

    function launchDashboard(html, COMMAND_MAP, FILES) {
      document.title = "Workspace | Operations Hub";
      document.getElementById("login-screen").remove();
      document.body.classList.add("dashboard-mode");
      const root = document.getElementById("app-root");
      root.style.display = "flex";
      root.innerHTML = html;

      let toastTimer;
      function showToast(message) {
        const toast = document.getElementById("copy-toast");
        const toastText = document.getElementById("toast-text");
        toastText.textContent = message;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2600);
      }

      // Настройка первой кнопки
      if (FILES && FILES.file1) {
        const f1Btn = document.getElementById("f1-download-btn");
        f1Btn.href = FILES.file1.url;
        if (FILES.file1.filename) f1Btn.setAttribute("download", FILES.file1.filename);
        document.getElementById("f1-version").textContent = FILES.file1.version;
        document.getElementById("f1-filename").textContent = FILES.file1.filename || FILES.file1.url;
        document.getElementById("f1-size").textContent = FILES.file1.size;

        f1Btn.addEventListener("click", () => {
          const btnText = document.getElementById("f1-btn-text");
          const orig = btnText.textContent;
          f1Btn.classList.add("downloading");
          btnText.textContent = "Downloading...";
          showToast("Starting download (" + FILES.file1.filename + ")");
          setTimeout(() => {
            f1Btn.classList.remove("downloading");
            btnText.textContent = orig;
          }, 2400);
        });
      }

      // Настройка второй кнопки
      if (FILES && FILES.file2) {
        const f2Btn = document.getElementById("f2-download-btn");
        f2Btn.href = FILES.file2.url;
        if (FILES.file2.filename) f2Btn.setAttribute("download", FILES.file2.filename);
        document.getElementById("f2-version").textContent = FILES.file2.version;
        document.getElementById("f2-filename").textContent = FILES.file2.filename || FILES.file2.url;
        document.getElementById("f2-size").textContent = FILES.file2.size;

        f2Btn.addEventListener("click", () => {
          const btnText = document.getElementById("f2-btn-text");
          const orig = btnText.textContent;
          f2Btn.classList.add("downloading");
          btnText.textContent = "Downloading...";
          showToast("Starting download (" + FILES.file2.filename + ")");
          setTimeout(() => {
            f2Btn.classList.remove("downloading");
            btnText.textContent = orig;
          }, 2400);
        });
      }

      document.querySelectorAll(".card[data-cmd]").forEach((card) => {
        card.addEventListener("click", async () => {
          if (card.classList.contains("copied")) return;
          const cmdKey = card.getAttribute("data-cmd");
          const textToCopy = COMMAND_MAP[cmdKey];
          if (!textToCopy) return;

          try { await navigator.clipboard.writeText(textToCopy); } catch (e) {}

          const badge = card.querySelector(".card-badge");
          const action = card.querySelector(".action-label");
          const origBadge = badge ? badge.textContent : "";
          const origAction = action ? action.innerHTML : "";

          card.classList.add("copied");
          if (badge) badge.textContent = "COPIED ✓";
          if (action) action.innerHTML = "Copied to Clipboard";

          const title = card.querySelector(".card-title").textContent;
          showToast(title + " payload copied to clipboard");

          setTimeout(() => {
            card.classList.remove("copied");
            if (badge) badge.textContent = origBadge;
            if (action) action.innerHTML = origAction;
          }, 1600);
        });
      });
    }
  </script>
</body>
